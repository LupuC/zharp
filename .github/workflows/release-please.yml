name: Release Please

# Keeps one release pull request open, built from the conventional commits on
# main. It covers whichever platforms have unreleased commits under them, and
# merging it bumps each of those, tags them and publishes their releases.
#
# THE VERSION MODEL
#
#   0.16   the LINE. Every platform is on it. It moves when a feature ships,
#          and it moves for all platforms together.
#   .2     the PATCH. It belongs to one platform's own bug fixes. Windows can
#          sit on 0.16.2 while macOS is still on 0.16.0, because macOS had
#          nothing to fix and so was never rebuilt.
#
# release-please assigns each commit to a component by the path it touches, so
# a `fix:` under windows/ bumps only windows. That is what gives you the patch
# half. There is no setting that gives you the line half: linked-versions syncs
# the whole version including the patch, which is what this repository did
# before and is exactly the rebuild we are avoiding.
#
# So the line is enforced outside release-please, by .github/workflows/
# version-line.yml, which fails any pull request whose platforms disagree on
# major.minor. Read the comment at the top of that file before changing this
# one: without it, a `feat:` touching only macos/ bumps macOS to 0.17.0 and
# leaves Windows behind, which is the drift the monorepo exists to prevent.
#
# WHAT MERGING THE RELEASE PR DOES, per platform that moved:
#
#   1. bumps <platform>/version.txt,
#   2. bumps the version inside the files that embed it:
#      windows/Directory.Build.props and windows/installer/zharp.iss,
#      macos/Sources/ZharpApp/App.swift,
#   3. writes the entry into <platform>/CHANGELOG.md,
#   4. tags <platform>-vX.Y.Z and publishes that platform's GitHub release.
#
# Each release then triggers release.yml, which reads the platform off the tag
# and builds only that one.
#
# Never edit a version by hand. release.yml refuses to build when a platform's
# version.txt disagrees with the tag, and version-line.yml refuses to merge a
# pull request that puts the platforms on different lines.

on:
  push:
    branches: [main]
  # Manual trigger, for the case where a run failed for a reason outside the
  # workflow, such as the repository setting that lets Actions open pull
  # requests being off. Without this you have to push a commit to retry.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (RELEASE_PLEASE_TOKEN) makes the whole chain hands-off:
          # pull requests opened with the default bot token need a maintainer
          # to approve their workflow runs, and a release published with the
          # bot token does not fire the `release` event that release.yml waits
          # on. Without the secret everything still works, but you have to run
          # release.yml manually afterwards with the tag as input.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
